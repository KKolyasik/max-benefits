  - id: pushkin_card
    categories: [leisure]
    priority: 100
    match:
      age: [under_23]
    title: "🎫 Пушкинская карта"
    summary: >-
      Бесплатная карта от государства для граждан России от 14 до 22 лет
      включительно. На ней лежат деньги на билеты в театры, музеи, на
      концерты и в кино. В 2026 году номинал 5000 ₽ в год, Минкультуры
      объявляло о повышении до 7000 ₽: точную сумму увидишь в приложении.
      Потратить деньги можно только на билеты.
    steps:
      - "Подтверди учётную запись на Госуслугах, если она ещё не подтверждена."
      - "Установи приложение «Госуслуги Культура» и войди через Госуслуги."
      - "Оформи виртуальную Пушкинскую карту в приложении, это займёт пару минут."
      - "Покупай билеты с пометкой «Пушкинская карта» на Культура.РФ, в кассах и на сайтах площадок."
    documents:
      - "Подтверждённая учётная запись Госуслуг"
    where: "Приложение «Госуслуги Культура»"
    links:
