# База знаний «Навигатора студента» (стартовое наполнение MVP).
#
# Каждая запись — карточка, которую бот покажет пользователю, если его ответы
# подходят под условия:
#
#   categories — в каких разделах меню показывать (ID из survey.yaml);
#   priority   — чем больше, тем выше в подборке;
#   match      — условия по ответам анкеты: вопрос -> подходящие варианты.
#                Карточка подходит, если по КАЖДОМУ вопросу выбран хотя бы
#                один из перечисленных вариантов. Нет match — карточка для всех;
#   links[].when — такое же условие для отдельной ссылки (например, ссылка
#                на страницу конкретного вуза).
#
# Бот проверяет файл при старте: опечатка в ID вопроса или варианта не даст
# ему запуститься. Проверить подборки можно без Макса: go run ./cmd/cli
#
# Тексты — markdown Макса: **жирный**, [ссылка](https://...). Символы * и _
# в обычном тексте лучше не использовать.
#
# Данные собраны из официальных источников в сентябре 2026 года. Правила
# меняются, поэтому каждую карточку перед релизом должен проверить человек.

entries:
  # ───────────────────────────── Льготы ─────────────────────────────

  - id: transport_pass
    categories: [benefits]
    priority: 100
    match:
      study_form: [full_time]
    title: "🚇 Студенческий проездной"
    summary: >-
      Льготный единый проездной на месяц: метро, автобусы, трамваи и
      троллейбусы. По тарифу 2026 года для студентов вузов он стоит 1599 ₽ в
      месяц. Если ездишь каждый день, это сильно дешевле, чем платить за
      каждую поездку.
    steps:
      - "Вуз сам передаёт данные о зачисленных студентах в базу метрополитена, обычно в сентябре. Если в кассе тебя не найдут, обратись в деканат или студофис."
      - "Оформи Единую карту петербуржца (ЕКП): на неё удобнее всего записать проездной. Без неё проездной запишут на временную карту прямо в кассе."
      - "Приходи в любую кассу метро с паспортом и студенческим. Там активируют транспортное приложение ЕКП (бесплатно) и запишут студенческий проездной."
      - "Дальше продлевай проездной каждый месяц: в кассах и автоматах метро или через Сбербанк."
    documents:
      - "Паспорт"
      - "Студенческий билет или зачётка"
      - "Единая карта петербуржца, если уже есть"
    where: "Любая касса Петербургского метрополитена"
    links:
      - title: "Проездные на сайте метро"
        url: "https://metro.spb.ru/ticket.html"
      - title: "Транспорт на портале ЕКП"
        url: "https://ekp.spb.ru/capabilities/transport"
      - title: "Инструкция Политеха"
        url: "https://www.spbstu.ru/students/social-security/making-concessionary-travel-public-transport/"
        when: {university: [polytech]}

  - id: suburban_discount
    categories: [benefits]
    priority: 70
    match:
      study_form: [full_time]
    title: "🚆 Скидка 50% на электрички"
    summary: >-
      С 1 сентября по 15 июня студенты очной формы петербургских вузов ездят
      на пригородных поездах Северо-Западной ППК за полцены. Пригодится, чтобы
      съездить к родным в Ленобласть или погулять в Петергофе.
    steps:
      - "Покажи студенческий в пригородной кассе и купи разовый билет со скидкой."
      - "Или оформи льготный билет в приложении «РЖД Пассажирам»."
    documents:
      - "Студенческий билет"
    where: "Пригородные кассы на вокзалах и станциях или приложение «РЖД Пассажирам»"
    links:
      - title: "Северо-Западная ППК"
        url: "https://ppk-piter.ru/"

  - id: social_scholarship
    categories: [benefits, scholarships]
    priority: 95
    match:
      study_form: [full_time]
      study_basis: [budget]
      social_status: [orphan, disability, low_income]
    title: "💳 Государственная социальная стипендия"
    summary: >-
      Ежемесячная выплата для бюджетников очной формы из льготных категорий:
      сирот, студентов с инвалидностью I и II группы или с детства, получателей
      государственной социальной помощи и некоторых других. Платят независимо
      от оценок и вместе с обычной академической стипендией.
    steps:
      - "Собери документ, который подтверждает льготу (список ниже)."
      - "Подай заявление на социальную стипендию в своём вузе: в студофис, деканат или через личный кабинет, как принято у тебя."
      - "Стипендию назначают со дня, когда документ попал в вуз, поэтому не откладывай. Справку о соцпомощи обновляй, когда закончится срок её действия."
    documents:
      - "Заявление на социальную стипендию (бланк дадут в вузе)"
      - "Сиротам: документы о статусе сироты или об отсутствии попечения родителей"
      - "При инвалидности: справка МСЭ"
      - "Семьям с низким доходом: справка о назначении государственной социальной помощи"
    where: "Студофис, деканат или отдел социальной поддержки твоего вуза"
    links:
      - title: "Стипендии СПбГУ"
        url: "https://spbu.ru/sveden/grants"
        when: {university: [spbu]}
      - title: "Соцстипендия в ВШЭ СПб"
        url: "https://spb.hse.ru/aup/youthpolicy/socq/socscholarship"
        when: {university: [hse]}
      - title: "Поддержка в Горном"
        url: "https://spmi.ru/materialnaya-i-socialnaya-podderzhka-obuchayuschimsya"
        when: {university: [mining]}
      - title: "Соцстипендия в ИТМО"
        url: "https://student.itmo.ru/ru/scholarship_social/"
        when: {university: [itmo]}
      - title: "Соцподдержка в Политехе"
        url: "https://www.spbstu.ru/students/social-security/social-support/"
        when: {university: [polytech]}

  - id: state_social_assistance
    categories: [benefits, scholarships]
    priority: 90
    match:
      social_status: [low_income, many_children, pensioner_parents]
    title: "📄 Справка о государственной социальной помощи"
    summary: >-
      Если доход на человека в семье ниже прожиточного минимума, можно
      оформить государственную социальную помощь. Справка о ней открывает
      социальную стипендию, повышенную стипендию для 1–2 курса и материальную
      помощь в вузе. Многодетные семьи и семьи с родителями-пенсионерами часто
      проходят по доходу, но каждый случай проверяют отдельно.
    steps:
      - "Посчитай средний доход на человека в семье за последние месяцы и сравни с прожиточным минимумом в регионе. Если он ниже, у вас есть шанс на соцпомощь."
      - "Подай заявление на государственную социальную помощь через Госуслуги или в МФЦ по месту регистрации, приложи справки о доходах."
      - "Когда помощь назначат, возьми справку о том, что ты или твоя семья её получаете, и отнеси в вуз."
    documents:
      - "Паспорт"
      - "Справки о доходах членов семьи: зарплата, пенсии, стипендия"
      - "Документы о составе семьи"
    where: "МФЦ, Госуслуги или соцзащита по месту регистрации"
    links:
      - title: "Госуслуги Петербурга"
        url: "https://gu.spb.ru/"
      - title: "Госуслуги"
        url: "https://www.gosuslugi.ru/"

  - id: material_support
    categories: [benefits, scholarships]
    priority: 85
    match:
      social_status: [orphan, disability, low_income, many_children, pensioner_parents]
    title: "🤝 Материальная помощь от вуза"
    summary: >-
      Разовые выплаты студентам в трудной ситуации: из многодетных и
      малообеспеченных семей, с инвалидностью, сиротам, при болезни, рождении
      ребёнка и в других случаях. Основания, размер и сроки подачи каждый вуз
      устанавливает сам. Заявления обычно принимают несколько раз в год.
    steps:
      - "Открой страницу материальной поддержки своего вуза (ссылка ниже) и найди список оснований и ближайший срок подачи."
      - "Собери документы, которые подтверждают твою ситуацию."
      - "Подай заявление в студофис, деканат, профком или через личный кабинет. Решение принимает стипендиальная комиссия."
    documents:
      - "Заявление (бланк на сайте вуза или в профкоме)"
      - "Подтверждение основания: справка МСЭ, справка о составе семьи, справка о соцпомощи и т. п."
    where: "Студофис, деканат или профком твоего вуза"
    links:
      - title: "Материальная поддержка СПбГУ"
        url: "https://students.spbu.ru/mmen-stipendii/materialnaya-pomoshch.html"
        when: {university: [spbu]}
      - title: "Меры поддержки ВШЭ СПб"
        url: "https://spb.hse.ru/aup/youthpolicy/socq/supforst"
        when: {university: [hse]}
      - title: "Поддержка в Горном"
        url: "https://spmi.ru/materialnaya-i-socialnaya-podderzhka-obuchayuschimsya"
        when: {university: [mining]}
      - title: "Материальная поддержка ИТМО"
        url: "https://student.itmo.ru/ru/scholarship_social_2/"
        when: {university: [itmo]}
      - title: "Соцподдержка в Политехе"
        url: "https://www.spbstu.ru/students/social-security/social-support/"
        when: {university: [polytech]}

  - id: disability_support
    categories: [benefits]
    priority: 80
    match:
      social_status: [disability]
    title: "♿ Поддержка студентов с инвалидностью"
    summary: >-
      Кроме социальной стипендии, у студентов с инвалидностью есть право на
      приоритетное место в общежитии и на адаптированные условия учёбы,
      например дополнительное время на экзаменах. Во многих вузах есть отдел
      инклюзивного образования, который помогает всё это оформить.
    steps:
      - "Принеси в вуз справку МСЭ и индивидуальную программу реабилитации (ИПРА), чтобы твой статус учли."
      - "Обратись в отдел инклюзивного образования или студофис и расскажи, какие условия учёбы тебе нужны."
      - "Оформи социальную стипендию и подай заявление на материальную помощь: об этом отдельные карточки в подборке."
    documents:
      - "Справка МСЭ"
      - "ИПРА: индивидуальная программа реабилитации или абилитации"
    where: "Студофис или отдел инклюзивного образования вуза"
    links:
      - title: "Инклюзия в ВШЭ СПб: соцстипендия"
        url: "https://spb.hse.ru/inclusive/social_scholarship"
        when: {university: [hse]}
      - title: "Инклюзия в ВШЭ СПб: материальная помощь"
        url: "https://spb.hse.ru/inclusive/material"
        when: {university: [hse]}

  - id: dormitory
    categories: [benefits]
    priority: 75
    match:
      origin: [other_region]
      housing: [renting]
    title: "🛏 Место в общежитии"
    summary: >-
      Снимать жильё в Петербурге дорого, а место в общежитии стоит в разы
      дешевле. Иногородним студентам очной формы вузы дают общежитие при
      наличии мест, а студентам с правом на социальную стипендию — в первую
      очередь. Места освобождаются и в течение года, так что пробовать стоит
      не только летом.
    steps:
      - "Узнай на сайте вуза или в студгородке, как подать заявку на общежитие и бывают ли свободные места в течение года."
      - "Подай заявление. Если у тебя есть льгота (сирота, инвалидность, соцстипендия), приложи документы: так ты попадёшь в приоритетную очередь."
      - "Когда место дадут, подпиши договор найма и оформи временную регистрацию через общежитие."
    documents:
      - "Заявление на общежитие"
      - "Паспорт"
      - "Документы о льготе, если есть"
    where: "Студгородок или жилищный отдел твоего вуза"

  - id: polyclinic
    categories: [benefits]
    priority: 65
    match:
      origin: [other_region]
    title: "🏥 Поликлиника в Петербурге"
    summary: >-
      Полис ОМС действует по всей России, поэтому лечиться бесплатно можно и
      в Петербурге, даже без местной прописки. Но сначала нужно прикрепиться к
      поликлинике рядом с домом или общежитием: без этого плановый приём не
      получить, только экстренную помощь.
    steps:
      - "Выбери поликлинику рядом с домом или общежитием. У некоторых вузов есть своя студенческая поликлиника или медпункт, спроси в студофисе."
      - "Подай заявление о прикреплении через Госуслуги или в регистратуре поликлиники."
      - "Если страховой компании, которая выдала твой полис, нет в Петербурге, выбери новую через Госуслуги или в офисе страховой."
    documents:
      - "Паспорт"
      - "Полис ОМС"
      - "СНИЛС"
    where: "Регистратура выбранной поликлиники или Госуслуги"
    links:
      - title: "Госуслуги"
        url: "https://www.gosuslugi.ru/"

  - id: temporary_registration
    categories: [benefits]
    priority: 60
    match:
      origin: [other_region]
    title: "🏠 Временная регистрация"
    summary: >-
      Если ты из другого региона и живёшь в Петербурге больше 90
      дней, по закону нужна регистрация по месту пребывания. В общежитии её
      обычно оформляет вуз, а если снимаешь жильё, нужно согласие
      собственника.
    steps:
      - "Живёшь в общежитии: уточни в студгородке или паспортном столе общежития, оформлена ли регистрация."
      - "Снимаешь квартиру: договорись с собственником, что он даст согласие на регистрацию."
      - "Подай заявление через Госуслуги или в МФЦ. Собственник подтверждает согласие там же."
    documents:
      - "Паспорт"
      - "Согласие собственника жилья, если снимаешь"
    where: "Госуслуги или МФЦ"
    links:
      - title: "Госуслуги"
        url: "https://www.gosuslugi.ru/"

  - id: contract_to_budget
    categories: [benefits, scholarships]
    priority: 55
    match:
      study_basis: [contract]
    title: "💸 Как перейти с платного на бюджет"
    summary: >-
      Если учишься на контракте, можно перевестись на бесплатное место, когда
      на твоей программе освобождаются бюджетные места. Для этого не должно
      быть долгов по учёбе и оплате и дисциплинарных взысканий, а ещё нужно
      либо сдавать сессии без троек, либо относиться к льготной категории
      (например, сирота). Кроме того, многие вузы дают платникам скидки за
      хорошую учёбу.
    steps:
      - "Найди на сайте вуза положение о переходе с платного обучения на бесплатное и объявления о вакантных бюджетных местах. Обычно их публикуют после сессий."
      - "Проверь, что подходишь по условиям: нет долгов и взысканий, последние сессии без троек или есть льгота."
      - "Подай заявление в деканат или студофис в сроки, указанные в объявлении."
      - "Спроси в студофисе о скидках на обучение за успеваемость."
    documents:
      - "Заявление о переходе на бесплатное обучение"
      - "Документы о льготе, если переходишь по ней"
    where: "Деканат или студофис твоего вуза"
    links:
      - title: "Положение о переходе в Политехе"
        url: "https://sbor.spbstu.ru/userfiles/files/2024/perevod.pdf"
        when: {university: [polytech]}

  - id: student_office
    categories: [benefits]
    priority: 10
    title: "🧭 Куда идти с любым вопросом"
    summary: >-
      Если не знаешь, куда обратиться, иди в студенческий офис (студофис) или
      профком своего вуза: там помогают с проездным, стипендиями, общежитием и
      материальной помощью. Члены профсоюза могут получать дополнительную
      материальную помощь и билеты на мероприятия. Официальный список
      стипендий и мер поддержки есть на сайте любого вуза в разделе «Сведения
      об образовательной организации», адрес обычно заканчивается на
      /sveden/grants.
    links:
      - title: "Студентам СПбГУ"
        url: "https://students.spbu.ru/"
        when: {university: [spbu]}
      - title: "Меры поддержки ВШЭ СПб"
        url: "https://spb.hse.ru/aup/youthpolicy/socq/supforst"
        when: {university: [hse]}
      - title: "Поддержка в Горном"
        url: "https://spmi.ru/materialnaya-i-socialnaya-podderzhka-obuchayuschimsya"
        when: {university: [mining]}
      - title: "Портал студентов ИТМО"
        url: "https://student.itmo.ru/ru/opportunities/"
        when: {university: [itmo]}
      - title: "Соцподдержка в Политехе"
        url: "https://www.spbstu.ru/students/social-security/social-support/"
        when: {university: [polytech]}

  # ──────────────────────────── Стипендии ────────────────────────────

  - id: academic_scholarship
    categories: [scholarships]
    priority: 100
    match:
      study_form: [full_time]
      study_basis: [budget]
    title: "🎓 Государственная академическая стипендия"
    summary: >-
      Базовая стипендия для бюджетников очной формы. На первом курсе до первой
      сессии её получают все. Дальше её назначают по итогам каждой сессии,
      если нет троек и долгов. Во многих вузах за сессию на «отлично» платят
      больше.
    steps:
      - "Оформи карту «Мир» и передай реквизиты в вуз, если этого ещё нет: стипендию платят только на неё."
      - "Закрывай сессии вовремя и без троек, чтобы стипендию продлевали."
      - "Если сессия закрыта на «отлично», проверь, положена ли в твоём вузе увеличенная сумма."
    documents:
      - "Реквизиты карты «Мир»"
    where: "Бухгалтерия или студофис вуза"
    links:
      - title: "Стипендии СПбГУ"
        url: "https://spbu.ru/sveden/grants"
        when: {university: [spbu]}
      - title: "Гайд по стипендиям ВШЭ СПб"
        url: "https://spb.hse.ru/news/845530619.html"
