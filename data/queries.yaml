# Поисковые запросы агента (go run ./cmd/agent collect). Файл перечитывается
# при каждом запуске, так что запросы можно менять без перезапуска.
#
#   text     — запрос в поисковик. Работают операторы поиска, например
#              site:spbu.ru — искать только на сайте СПбГУ;
#   category — раздел бота (ID из survey.yaml), для которого агент соберёт
#              карточки;
#   results  — сколько страниц прочитать, не больше одной с сайта.
#
# Каждый запрос — один поиск и один вызов модели (если страницы изменились с
# прошлого запуска), поэтому лучше несколько точных запросов, чем много
# общих.

defaults:
  results: 5

queries:
  # ───────────────────────────── Льготы ─────────────────────────────
  - text: "студенческий проездной Санкт-Петербург 2026 стоимость как оформить"
    category: benefits
  - text: "льготы студентам на пригородные электрички Санкт-Петербург"
    category: benefits
  - text: "государственная социальная помощь студентам Санкт-Петербург"
    category: benefits
  - text: "материальная помощь студентам вуза как получить"
    category: benefits
  - text: "временная регистрация иногородних студентов в общежитии Санкт-Петербург"
    category: benefits
  - text: "прикрепление к поликлинике иногороднего студента Санкт-Петербург полис ОМС"
    category: benefits

  # ──────────────────────────── Стипендии ───────────────────────────
  - text: "размер государственной академической стипендии 2026 Санкт-Петербург вузы"
    category: scholarships
  - text: "повышенная государственная академическая стипендия ПГАС критерии"
    category: scholarships
  - text: "стипендия Правительства Санкт-Петербурга студентам 2026"
    category: scholarships
  - text: "именные стипендии для студентов 2026 конкурс"
    category: scholarships

  # ───────────────────────── Досуг и скидки ─────────────────────────
  - text: "бесплатное посещение музеев студентам Санкт-Петербург"
    category: leisure
  - text: "скидки студентам театры Санкт-Петербург"
    category: leisure
  - text: "Пушкинская карта что можно купить Санкт-Петербург 2026"
    category: leisure
