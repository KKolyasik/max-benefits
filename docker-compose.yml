x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bot:
    # Locally `docker compose up --build` builds the image. On the server the
    # deploy script loads a prebuilt image and sets BOT_IMAGE to its tag.
    build: .
    image: ${BOT_IMAGE:-max-benefits-bot:local}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://benefits:${POSTGRES_PASSWORD:-benefits}@postgres:5432/benefits?sslmode=disable
      # The agent's drafts come through Kafka; the cards and the admins'
      # decisions go back.
      KAFKA_BROKERS: kafka:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    # The questionnaire is mounted, so it can be edited without rebuilding
    # the image: `docker compose restart bot`. knowledge.yaml only fills an
    # empty database; after that cards change through the admin screens.
    volumes:
      - ./data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    # Lets the bot finish events it already took from MAX.
    stop_grace_period: 30s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Append-only file: questionnaire progress survives Redis restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Cards and the agent's drafts. Published on localhost:5432 for
  # go run ./cmd/cli -db and the database tests.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: benefits
      POSTGRES_DB: benefits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benefits}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benefits -d benefits"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Free metasearch for the agent when there is no Yandex Search API key.
  # Only started on request: docker compose --profile agent up -d searxng
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    profiles: [agent]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8888:8080
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    logging: *logging

  # Kafka between the bot and the agent: one broker in KRaft mode, without
  # ZooKeeper. Services in compose reach it at kafka:19092, the agent and
  # tests on the host at localhost:9092.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The services create their topics with the right settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 127.0.0.1:9092:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    logging: *logging

  # Keeps the Avro schemas of the messages, in Kafka itself (the _schemas
  # topic), and refuses incompatible versions, see contract/.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - 127.0.0.1:8085:8081
    depends_on:
      kafka:
        condition: service_healthy
    # The image has neither curl nor wget, so the check talks HTTP itself.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

volumes:
  redis-data:
  postgres-data:
  kafka-data:
