# SearXNG — бесплатный метапоиск для агента, когда нет ключа Yandex Search
# API. Только для локальных прогонов:
#
#   docker compose --profile agent up -d searxng
#
# Агент берёт результаты в JSON, поэтому формат json включён явно.
use_default_settings: true

server:
  # Инстанс слушает только localhost и никому не выдаётся, ключ подписывает
  # лишь cookie интерфейса. Переопределяется переменной SEARXNG_SECRET.
  secret_key: "local-agent-search"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json
