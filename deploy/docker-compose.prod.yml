# Production stack on the server. CI uploads this file to DEPLOY_PATH
# (/opt/max-benefits) and runs it with the .env next to it: BOT_IMAGE and
# WEBHOOK_URL come from the deploy, the rest is set on the server.
# The questionnaire is baked into the image, so a rollback restores it with
# the code. The cards live in Postgres: the image only fills an empty
# database, and cards approved by admins survive deploys and rollbacks.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bot:
    image: ${BOT_IMAGE:?set BOT_IMAGE to the image to run}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
      # The deploy generates POSTGRES_PASSWORD into .env once.
      DATABASE_URL: postgres://benefits:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/benefits?sslmode=disable
      # MAX sends updates to nginx on the host, which proxies them to the
      # published port. WEBHOOK_SECRET is in .env as well.
      WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
      # The agent's drafts come through Kafka; the cards and the admins'
      # decisions go back.
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    # Only nginx on the same host can reach the bot. BOT_PORT is the port
    # nginx proxies to.
    ports:
      - "127.0.0.1:${BOT_PORT:-8081}:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: benefits
      POSTGRES_DB: benefits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Not published: only the bot reaches it, over the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benefits -d benefits"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One Kafka broker in KRaft mode, reachable only inside the project's
  # network: the bot and, later, the agent.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The services create their topics with the right settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    logging: *logging

  # The Avro schemas of the messages, kept in Kafka itself.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka:
        condition: service_healthy
    # The image has neither curl nor wget, so the check talks HTTP itself.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

volumes:
  redis-data:
  postgres-data:
  kafka-data:
